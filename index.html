<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Ellen Bruist Mee - Creatieve Onderwijsexpert</title>
    <meta name="description" content="Ellen Bruist Mee biedt creatief onderwijswerk, talentontwikkeling en maatwerk voor hoogbegaafde en hooggevoelige kinderen, thuiszitters en scholen. Kijken wat wél kan!" />
    <meta name="keywords" content="onderwijs expert, hoogbegaafdheid, hooggevoeligheid, thuiszitters, creatief onderwijs, Ellen Bruist Mee, talentontwikkeling, speciaal onderwijs" />
    <meta name="author" content="Ellen Bruist Mee" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,600;1,700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-brand-cream text-brand-aubergine font-sans overflow-x-hidden antialiased">
    <!-- SVG Noise/Texture Overlay -->
    <svg class="pointer-events-none fixed inset-0 z-[9999] h-full w-full opacity-[0.038] mix-blend-overlay" xmlns="http://www.w3.org/2000/svg">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" />
    </svg>

    <!-- Netlify Forms: verborgen statisch formulier zodat Netlify het bij de build detecteert -->
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="role" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
